name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to verify and publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOWORK: 'off'
      GOPRIVATE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.version || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and verify all wire artifacts on the release tag
        shell: bash
        run: |
          make generate-api
          generated_status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$generated_status" ]; then
            echo "Regeneration changed tracked files or produced untracked artifacts:"
            echo "$generated_status"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Check public Go API compatibility
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: go run ./tools/compatibility -policy release -base previous-release -version "$VERSION"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0
      - name: Run all lint checks
        run: make lint
      - name: Verify wire model, endpoint and fixture contracts on the tag
        run: make test-contracts routegate
      - name: Verify non-generated coverage on the tag
        run: make test-cover
      - run: go test -race ./... -timeout 120s
      - run: go vet ./...
      - name: Check CLI module
        run: make check-cli
      - name: Verify public module
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cd "$(mktemp -d)"
          go mod init example.com/release-check
          GOPROXY=https://proxy.golang.org,direct go get "github.com/portpowered/go-ring@$VERSION"
          go list -m all
          cat > consumer.go <<'EOF'
          package main

          import (
            _ "github.com/portpowered/go-ring/pkg/generatedhttp"
            _ "github.com/portpowered/go-ring/pkg/generatedsignaling"
            _ "github.com/portpowered/go-ring/pkg/ringapimodels"
            "github.com/portpowered/go-ring/pkg/ring"
          )

          func main() {
            _, _ = ring.NewClient()
          }
          EOF
          go mod tidy
          go build .
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          notes_file="docs/releases/${VERSION}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$VERSION" --verify-tag --notes-file "$notes_file"
          else
            gh release create "$VERSION" --verify-tag --generate-notes
          fi
