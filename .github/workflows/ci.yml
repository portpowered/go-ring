name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      GOPRIVATE: ''
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go test -race ./... -timeout 120s
      - run: go vet ./...
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GOWORK: 'off'
      GOPRIVATE: ''
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.x'
      - name: Replay coverage (primary compatibility gate)
        run: go run ./tools/coverage -suite replay
      - name: Unit coverage
        run: go run ./tools/coverage -suite unit
      - name: Combined coverage
        run: go run ./tools/coverage -suite combined
      - name: Upload replay coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.replay.out
          flags: replay
          fail_ci_if_error: false
          use_oidc: true
      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.unit.out
          flags: unit
          fail_ci_if_error: false
          use_oidc: true
  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.x'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0
      - run: golangci-lint run ./...
  schema-generation:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make generate-api
      - run: git diff --exit-code -- pkg/generatedhttp pkg/generatedsignaling pkg/ringapimodels/models.gen.go
  reference-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
      - name: Install uv
        run: python -m pip install uv==0.8.22
      - name: Verify Python baseline and shared recordings
        run: python tools/verify_reference.py
