name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      GOPRIVATE: ''
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go test -race ./... -timeout 120s
      - run: go vet ./...
      - name: Check CLI module
        run: make check-cli
      - name: Check API route contracts against source callsites
        run: make routegate
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
  api-compatibility:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOPRIVATE: ''
      GOTOOLCHAIN: local
      COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Check public Go API compatibility
        run: go run ./tools/compatibility -policy report -base "$COMPAT_BASE"
  public-consumer:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOPRIVATE: ''
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Build downstream consumer without a receiver replace
        shell: bash
        run: |
          consumer_dir="$(mktemp -d)"
          cd "$consumer_dir"
          go mod init example.com/go-ring-consumer
          go mod edit -require=github.com/portpowered/go-ring@v0.0.0 -replace=github.com/portpowered/go-ring="$GITHUB_WORKSPACE"
          cat > consumer.go <<'EOF'
          package main

          import (
            _ "github.com/portpowered/go-ring/pkg/generatedhttp"
            _ "github.com/portpowered/go-ring/pkg/generatedsignaling"
            _ "github.com/portpowered/go-ring/pkg/ringapimodels"
            "github.com/portpowered/go-ring/pkg/ring"
          )

          func main() {
            _, _ = ring.NewClient()
          }
          EOF
          go mod tidy
          modules="$(go list -m all)"
          printf '%s\n' "$modules"
          if printf '%s\n' "$modules" | grep -q '^github.com/crow-misia/go-push-receiver[[:space:]]'; then
            echo "Consumer unexpectedly resolves the unpublished push receiver module."
            exit 1
          fi
          go build .
  docs-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: portpowered/api-docs-website-github-action
          ref: v0.3.1
          path: .api-docs-action
      - name: Build rendered API references and guides
        uses: ./.api-docs-action
        with:
          title: go-ring API Reference
          openapi: api/openapi.yaml
          asyncapi: api/asyncapi.yaml
          discover: false
          guides-directory: docs/guides
          base-path: /go-ring
          source-directory: .
          output: api-docs-out
      - name: Test rendered-site link checker
        run: node --test tools/docs/check-internal-links.test.mjs
      - name: Check rendered-site internal links
        run: node tools/docs/check-internal-links.mjs api-docs-out /go-ring
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GOWORK: 'off'
      GOPRIVATE: ''
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.x'
      - name: Replay coverage (primary compatibility gate)
        run: go run ./tools/coverage -suite replay
      - name: Unit coverage
        run: go run ./tools/coverage -suite unit
      - name: Combined coverage
        run: go run ./tools/coverage -suite combined
      - name: Publish replay coverage badge and report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncruces/go-coverage-report@dfc237255099f2d25066babde51253992175e365 # v0
        with:
          coverage-file: coverage.replay.out
          badge-title: replay coverage
          report: true
          chart: true
          amend: true
      - name: Upload replay coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.replay.out
          flags: replay
          fail_ci_if_error: false
          use_oidc: true
      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.unit.out
          flags: unit
          fail_ci_if_error: false
          use_oidc: true
  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.x'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0
      - run: make lint
  schema-generation:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: make generate-api
      - name: Check generated artifacts are current and tracked
        shell: bash
        run: |
          generated_status="$(git status --porcelain --untracked-files=all -- internal/generatedhttp internal/generatedfcm internal/generatedsignaling internal/protocol/endpoints.go internal/protocol/signaling.go internal/protocol/fcm.go internal/protocol/mcs.gen.go pkg/generatedhttp pkg/generatedsignaling pkg/dependencymodels/models.gen.go pkg/ringapimodels/models.gen.go)"
          if [ -n "$generated_status" ]; then
            echo "Generated API artifacts changed or are untracked:"
            echo "$generated_status"
            exit 1
          fi
  fixture-contracts:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install protocol tooling dependencies
        run: npm ci --prefix tools/protocols --ignore-scripts
      - name: Audit protocol tooling dependencies
        run: npm audit --prefix tools/protocols --audit-level=moderate
      - name: Run fixture and schema contracts
        run: go test ./tools/protocols ./tools/capture
