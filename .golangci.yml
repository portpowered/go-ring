version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - contextcheck
    - govet
    - dupl
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gocritic
    - gosec
    - mnd
    - goconst
    - cyclop
    - forbidigo
    - makezero
    - mirror
    - misspell
    - nilerr
    - nilnil
    - nolintlint
    - prealloc
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    forbidigo:
      forbid:
        - pattern: '^fmt\.Errorf$'
          msg: Use a typed error that preserves the underlying cause.
        - pattern: '^errors\.New$'
          msg: Use a typed error or a named terminal reason.
    cyclop:
      max-complexity: 25
    mnd:
      checks: [argument, case, condition, operation, return]
      ignored-numbers: ['0', '1', '2', '10', '64', '100', '0o600']
    goconst:
      min-len: 8
      min-occurrences: 2
    revive:
      rules:
        - name: nested-structs
        - name: function-length
          arguments: [120, 200]
        - name: file-length-limit
          arguments:
            - max: 650
              skip-comments: true
              skip-blank-lines: true
  exclusions:
    generated: strict
    rules:
      # Scenario fixtures repeat wire literals, retain synthetic errors, and use handler signatures that contextcheck misreads.
      - path: '(^|/)[^/]+_test\.go$'
        linters: [contextcheck, cyclop, forbidigo, goconst]
      # These CLI paths own cleanup through context-free Close APIs and use a bounded detached context for PTZ stop during cancellation.
      - path: '^cmd/go-ring/(main|snapshot_rtc|tokens|view)\.go$'
        linters: [contextcheck]
    paths:
      - '^pkg/generatedsignaling/'

formatters:
  enable:
    - gofmt
