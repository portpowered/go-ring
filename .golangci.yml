version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - mnd
    - goconst
    - cyclop
  settings:
    cyclop:
      max-complexity: 25
    mnd:
      checks: [argument, case, condition, operation, return]
      ignored-numbers: ['0', '1', '2', '10', '64', '100']
    goconst:
      min-occurrences: 3
    revive:
      rules:
        - name: nested-structs
        - name: function-length
          arguments: [120, 200]
        - name: file-length-limit
          arguments:
            - max: 650
              skip-comments: true
              skip-blank-lines: true
  exclusions:
    rules:
      - path: '(^|/)(pkg/generatedhttp|pkg/generatedsignaling)/'
        linters: [revive, govet, unused, staticcheck, mnd, goconst, cyclop]
      - path: '(^|/)pkg/ringapimodels/models\.gen\.go$'
        linters: [revive, govet, unused, staticcheck, mnd, goconst, cyclop]
      - path: '(^|/)pkg/dependencymodels/models\.gen\.go$'
        linters: [revive, govet, unused, staticcheck, mnd, goconst, cyclop]
      - path: '_test\.go$'
        linters: [revive, mnd, goconst, cyclop]
      - path: '(^|/)(test|tools|internal/testkit)/'
        linters: [revive, mnd, goconst, unused, staticcheck, cyclop]
      - path: '(^|/)examples/'
        linters: [mnd, cyclop]

formatters:
  enable:
    - gofmt
