openapi: 3.1.0
info:
  title: go-ring public model projections
  version: 0.3.0
  description: >-
    SDK-facing projections of Ring responses. These are deliberately separate
    from raw HTTP wire responses in openapi.yaml: the client normalizes device
    metadata and exposes stable Go fields after decoding.
paths: {}
components:
  schemas:
    VolumeKind:
      description: Legacy volume control target; selects the chime or doorbell endpoint.
      type: string
      enum: [chime, doorbell]
      x-enum-varnames: [VolumeKindChime, VolumeKindDoorbell]
    LightState:
      description: Legacy floodlight action.
      type: string
      enum: [on, off]
      x-enum-varnames: [LightStateOn, LightStateOff]
    SoundKind:
      description: Accepted legacy chime test sounds.
      type: string
      enum: [ding, motion]
      x-enum-varnames: [SoundKindDing, SoundKindMotion]
    InHomeChimeSettings:
      description: Supply exactly one field per update. Enabled maps to the legacy enable query value.
      type: object
      properties:
        type: {type: integer, minimum: 0}
        enabled: {type: boolean}
        duration: {type: integer, minimum: 0}
      minProperties: 1
      maxProperties: 1
    DeviceHealth:
      type: object
      required: [battery_level, battery_status, signal_strength, firmware_version, last_update]
      properties:
        battery_level: {type: [integer, 'null']}
        battery_status: {type: [string, 'null']}
        signal_strength: {type: [integer, 'null']}
        firmware_version: {type: [string, 'null']}
        last_update: {type: [string, 'null']}
    DeviceCapability:
      type: string
      description: A supported operation confirmed by an explicit inventory field. Unknown server capabilities remain representable.
      x-extensible-enum: [light, motion_detection, siren, live_view, ptz_pan_step, ptz_tilt_step, ptz_pan_continuous, ptz_tilt_continuous]
    DeviceType:
      type: string
      description: Normalized device class derived from a known hardware kind or explicit family. Unknown kinds remain OTHER; live-view support alone does not classify hardware.
      enum: [CAMERA, DOORBELL, CHIME, OTHER]
      x-enum-varnames: [DeviceTypeCamera, DeviceTypeDoorbell, DeviceTypeChime, DeviceTypeOther]
    Device:
      type: object
      description: One account device. An absent capability means support was not confirmed by inventory; it does not prove the operation is unsupported.
      required: [id, name, kind, family, type, address, timezone, capabilities]
      properties:
        id: {type: string, x-go-name: ID}
        name: {type: string}
        kind: {type: string, description: Open hardware kind from the server, x-extensible-enum: [stickup_cam_mini_ptz_v1, lpd_v1, chime, intercom_handset_audio]}
        type: {$ref: '#/components/schemas/DeviceType'}
        family: {type: string, description: Open server family; absent on some v3 responses, x-extensible-enum: [doorbots, chimes, stickup_cams, other]}
        address: {type: string}
        timezone: {type: string}
        wifi_name: {type: string}
        wifi_signal_strength: {type: integer}
        volume: {type: integer}
        light_brightness: {type: integer}
        motion_detection_enabled: {type: boolean}
        health: {$ref: '#/components/schemas/DeviceHealth'}
        capabilities: {type: array, items: {$ref: '#/components/schemas/DeviceCapability'}}
    DevicesResponse:
      type: object
      required: [devices]
      properties:
        devices: {type: array, items: {$ref: '#/components/schemas/Device'}}
    AuthResponse:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer}
        token_type: {type: string, description: Bearer is used by the implemented OAuth flow; unknown token types remain representable., x-extensible-enum: [Bearer]}
    EventKind:
      type: string
      description: Known event kinds are motion, ding and on_demand. Preserve future values from the service.
      x-extensible-enum: [motion, ding, on_demand]
    Event:
      type: object
      required: [kind, device_id, timestamp, data]
      properties:
        kind: {$ref: '#/components/schemas/EventKind'}
        device_id: {type: integer, format: int64, x-go-name: DeviceID}
        timestamp: {type: string}
        data: {type: object, additionalProperties: true}
    Recording:
      type: object
      required: [id, kind, answered, created_at, device_id]
      properties:
        id: {type: integer, format: int64, x-go-name: ID}
        kind: {type: string, description: "Known recording kinds are motion, ding and on_demand; future values remain valid.", x-extensible-enum: [motion, ding, on_demand]}
        answered: {type: boolean}
        created_at: {type: string}
        device_id: {type: integer, format: int64, x-go-name: DeviceID}
    RecordingHistoryResponse:
      type: object
      required: [recordings]
      properties:
        recordings: {type: array, items: {$ref: '#/components/schemas/Recording'}}
    DeviceKind:
      type: string
      description: Open hardware kind in device detail.
      x-go-type: ringtypes.DeviceKind
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [stickup_cam_mini_ptz_v1]
    DetailDeviceFamily:
      type: string
      description: Open device family in detail and inventory responses.
      x-go-type: ringtypes.DeviceFamily
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [doorbots, chimes, stickup_cams, other]
    ConnectionState:
      type: string
      description: Open connection state.
      x-go-type: ringtypes.ConnectionState
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [online, offline]
    PowerMode:
      type: string
      description: Open device power mode.
      x-go-type: ringtypes.PowerMode
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [wired]
    BatteryReading:
      description: Battery percentage accepted as a JSON number or numeric text by the SDK adapter.
      x-go-type: ringtypes.BatteryReading
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      oneOf:
        - {type: number, minimum: 0, maximum: 100}
        - {type: string, pattern: '^[0-9]+(\.[0-9]+)?$'}
    OwnerID:
      description: Numeric or text vendor owner identifier normalized to text by the SDK adapter.
      x-go-type: ringtypes.OwnerID
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      oneOf:
        - {type: string}
        - {type: integer, format: int64}
    DeviceOwner:
      type: object
      properties:
        id: {$ref: '#/components/schemas/OwnerID', x-go-name: ID}
        first_name: {type: string}
        last_name: {type: string}
        email: {type: string}
    DeviceLegacySettings:
      type: object
      properties:
        doorbell_volume: {type: integer}
        live_view_disabled: {type: boolean}
        motion_detection_enabled: {type: boolean}
        power_mode: {$ref: '#/components/schemas/PowerMode'}
    DeviceDetailHealth:
      type: object
      properties:
        battery_level: {type: integer}
        battery_percentage: {type: number, format: double}
        battery_present: {type: boolean}
        battery_percentage_category: {type: string}
        battery_status: {type: string}
        connected: {type: boolean}
        firmware_version: {type: string}
        last_update: {type: string}
        ptz_connected: {type: string, x-go-name: PTZConnected}
        rssi: {type: number, x-go-name: RSSI}
        signal_strength: {type: integer}
        supported_rpc_commands: {type: array, x-go-name: SupportedRPCCommands, x-go-type-skip-optional-pointer: true, items: {type: string}}
    FeatureEligibility:
      type: object
      properties:
        eligible: {type: boolean}
        ineligibility_reasons: {type: array, x-go-type-skip-optional-pointer: true, items: {type: string}}
    FeatureEnablement:
      type: object
      properties:
        allowed: {type: boolean}
        enabled: {type: boolean}
        disallow_reasons: {type: array, x-go-type-skip-optional-pointer: true, items: {type: string}}
    FeatureAvailability:
      type: object
      properties:
        eligibility: {$ref: '#/components/schemas/FeatureEligibility'}
        enablement: {$ref: '#/components/schemas/FeatureEnablement'}
    VideoRenderingFeature:
      type: object
      properties:
        max_digital_zoom_level: {type: number}
    DeviceFeatures:
      type: object
      properties:
        auto_track: {$ref: '#/components/schemas/FeatureAvailability'}
        auto_zoom_track: {$ref: '#/components/schemas/FeatureAvailability'}
        motions_enabled: {type: boolean}
        video_rendering: {$ref: '#/components/schemas/VideoRenderingFeature'}
    DeviceAlerts:
      type: object
      properties:
        connection: {$ref: '#/components/schemas/ConnectionState'}
    DeviceDetailDevice:
      type: object
      required: [id, description, kind]
      properties:
        id: {type: integer, format: int64, x-go-name: ID}
        device_id: {type: string, x-go-name: DeviceID}
        description: {type: string}
        kind: {$ref: '#/components/schemas/DeviceKind'}
        family: {$ref: '#/components/schemas/DetailDeviceFamily'}
        created_at: {type: string, format: date-time}
        deactivated_at: {type: string, format: date-time}
        name: {type: string}
        address: {type: string}
        location_id: {type: string, x-go-name: LocationID}
        operation_set: {type: string}
        owner: {$ref: '#/components/schemas/DeviceOwner'}
        settings: {$ref: '#/components/schemas/DeviceLegacySettings'}
        features: {$ref: '#/components/schemas/DeviceFeatures'}
        time_zone: {type: string}
        timezone: {type: string}
        wifi_name: {type: string}
        wifi_signal_strength: {type: integer}
        owned: {type: boolean}
        motion_detection_enabled: {type: boolean}
        has_light: {type: boolean}
        light_brightness: {type: integer}
        volume: {type: integer}
        health: {$ref: '#/components/schemas/DeviceDetailHealth'}
        alerts: {$ref: '#/components/schemas/DeviceAlerts'}
        battery_life: {$ref: '#/components/schemas/BatteryReading'}
        battery_life_2: {$ref: '#/components/schemas/BatteryReading'}
        external_connection: {type: boolean}
    DeviceDetail:
      type: object
      description: SDK projection of the generated device-detail wire response; operation sets are derived separately.
      required: [device]
      properties:
        device: {$ref: '#/components/schemas/DeviceDetailDevice'}
    DeviceStatus:
      type: object
      description: SDK-derived status from device detail, not an additional wire response.
      required: [is_offline]
      properties:
        battery_percent: {type: number, format: double, minimum: 0, maximum: 100}
        connection: {$ref: '#/components/schemas/ConnectionState'}
        is_offline: {type: boolean}
        power_mode: {$ref: '#/components/schemas/PowerMode'}
    LocationAddress:
      type: object
      properties:
        address1: {type: string}
        address2: {type: string}
        city: {type: string}
        country: {type: string}
        state: {type: string}
        timezone: {type: string}
        zip_code: {type: string}
    GeoCoordinates:
      type: object
      properties:
        latitude: {type: number}
        longitude: {type: number}
    LocationSummary:
      type: object
      required: [location_id, name]
      properties:
        location_id: {type: string, x-go-name: ID}
        name: {type: string}
        location_type: {type: string}
        is_owner: {type: boolean}
        owner_id: {type: integer, format: int64, x-go-name: OwnerID}
        address: {$ref: '#/components/schemas/LocationAddress'}
        geo_coordinates: {$ref: '#/components/schemas/GeoCoordinates'}
    LocationList:
      type: object
      description: SDK projection; OperationSets is derived outside JSON.
      required: [user_locations]
      properties:
        user_locations: {type: array, x-go-name: Locations, items: {$ref: '#/components/schemas/LocationSummary'}}
    LocationAttributes:
      type: object
      properties:
        name: {type: string}
        city: {type: string}
        country: {type: string}
        state: {type: string}
        latitude: {type: number}
        longitude: {type: number}
        time_zone: {type: string}
    LocationResourceType:
      type: string
      x-go-type: ringtypes.LocationResourceType
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [locations]
    LocationResource:
      type: object
      required: [id, type]
      properties:
        id: {type: string, x-go-name: ID}
        type: {$ref: '#/components/schemas/LocationResourceType'}
        attributes: {$ref: '#/components/schemas/LocationAttributes'}
    LocationMeta:
      type: object
      properties:
        time: {type: string, format: date-time}
    LocationDetail:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/LocationResource'}
        included: {type: array, x-go-type-skip-optional-pointer: true, items: {$ref: '#/components/schemas/LocationResource'}}
        meta: {$ref: '#/components/schemas/LocationMeta'}
    LocationGroup:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
    LocationGroups:
      type: object
      properties:
        device_groups: {type: array, x-go-type-skip-optional-pointer: true, items: {$ref: '#/components/schemas/LocationGroup'}}
        is_owner: {type: boolean}
    LocationGroupDevices:
      type: object
      required: [groups]
      properties:
        groups: {type: array, items: {$ref: '#/components/schemas/LocationGroup'}}
    TimelineEventType:
      type: string
      x-go-type: ringtypes.TimelineEventType
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [on_demand, ding, motion]
    RecordingStatus:
      type: string
      x-go-type: ringtypes.RecordingStatus
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [ready]
    TimelineState:
      type: string
      x-go-type: ringtypes.TimelineState
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [completed]
    TimelineDevice:
      type: object
      properties:
        id: {type: integer, format: int64, x-go-name: ID}
        description: {type: string}
        type: {type: string}
    TimelineEvent:
      type: object
      required: [event_id, event_type, start_time]
      properties:
        event_id: {type: string, x-go-name: ID}
        event_type: {allOf: [{$ref: '#/components/schemas/TimelineEventType'}], x-go-name: Type}
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
        duration_ms: {type: integer, minimum: 0, x-go-name: DurationMS}
        device: {$ref: '#/components/schemas/TimelineDevice'}
        source_id: {type: string, x-go-name: SourceID}
        is_favorite: {type: boolean}
        recording_status: {$ref: '#/components/schemas/RecordingStatus'}
        state: {$ref: '#/components/schemas/TimelineState'}
        schema: {type: string}
    DeviceTimeline:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TimelineEvent'}}
        pagination_key: {type: string}
    HistoryFeedType:
      type: string
      x-go-type: ringtypes.HistoryFeedType
      x-go-type-import: {path: github.com/portpowered/go-ring/pkg/ringtypes, name: ringtypes}
      x-extensible-enum: [EVENT]
    HistoryFeedItem:
      type: object
      properties:
        id: {type: string, x-go-name: ID}
        type: {$ref: '#/components/schemas/HistoryFeedType'}
    HistoryDevices:
      type: object
      required: [events]
      properties:
        events: {type: array, items: {$ref: '#/components/schemas/TimelineEvent'}}
        feed: {type: array, x-go-type-skip-optional-pointer: true, items: {$ref: '#/components/schemas/HistoryFeedItem'}}
        pagination_key: {type: string}
        schema: {type: string}
    CapturedTickets:
      type: object
      required: [host, ticket]
      properties:
        host: {type: string}
        ticket: {type: string}
        subscriptionTopics: {type: array, x-go-type-skip-optional-pointer: true, items: {type: string}}
