openapi: 3.1.0
info:
  title: go-ring public model projections
  version: 0.1.0
  description: >-
    SDK-facing projections of Ring responses. These are deliberately separate
    from raw HTTP wire responses in openapi.yaml: the client classifies device
    families, fills defaults, and exposes stable Go fields after decoding.
paths: {}
components:
  schemas:
    VolumeKind:
      description: Legacy volume control target; selects the chime or doorbell endpoint.
      type: string
      enum: [chime, doorbell]
      x-enum-varnames: [VolumeKindChime, VolumeKindDoorbell]
    LightState:
      description: Legacy floodlight action.
      type: string
      enum: [on, off]
      x-enum-varnames: [LightStateOn, LightStateOff]
    SoundKind:
      description: Accepted legacy chime test sounds.
      type: string
      enum: [ding, motion]
      x-enum-varnames: [SoundKindDing, SoundKindMotion]
    InHomeChimeSettings:
      description: Supply exactly one field per update. Enabled maps to the legacy enable query value.
      type: object
      properties:
        type: {type: integer, minimum: 0}
        enabled: {type: boolean}
        duration: {type: integer, minimum: 0}
      minProperties: 1
      maxProperties: 1
    DeviceHealth:
      type: object
      required: [battery_level, battery_status, signal_strength, firmware_version, last_update]
      properties:
        battery_level: {type: [integer, 'null']}
        battery_status: {type: [string, 'null']}
        signal_strength: {type: [integer, 'null']}
        firmware_version: {type: [string, 'null']}
        last_update: {type: [string, 'null']}
    Doorbell:
      type: object
      required: [id, name, family, address, timezone, wifi_name, wifi_signal_strength, volume, has_light, motion_detection_enabled]
      properties:
        id: {type: string, x-go-name: ID}
        name: {type: string}
        family: {type: string, description: Known family is doorbots; unknown families remain valid., x-extensible-enum: [doorbots, chimes, stickup_cams, other]}
        address: {type: string}
        timezone: {type: string}
        wifi_name: {type: string}
        wifi_signal_strength: {type: integer}
        volume: {type: integer}
        has_light: {type: boolean}
        light_brightness: {type: integer}
        motion_detection_enabled: {type: boolean}
        health: {$ref: '#/components/schemas/DeviceHealth'}
    Chime:
      type: object
      required: [id, name, family, address, timezone, wifi_name, wifi_signal_strength, volume]
      properties:
        id: {type: string, x-go-name: ID}
        name: {type: string}
        family: {type: string, description: Known family is chimes; unknown families remain valid., x-extensible-enum: [doorbots, chimes, stickup_cams, other]}
        address: {type: string}
        timezone: {type: string}
        wifi_name: {type: string}
        wifi_signal_strength: {type: integer}
        volume: {type: integer}
        health: {$ref: '#/components/schemas/DeviceHealth'}
    StickUpCam:
      type: object
      required: [id, name, description, family, address, timezone, wifi_name, wifi_signal_strength, volume, has_light, motion_detection_enabled]
      properties:
        id: {type: string, x-go-name: ID}
        name: {type: string}
        description: {type: string}
        family: {type: string, description: Known family is stickup_cams; unknown families remain valid., x-extensible-enum: [doorbots, chimes, stickup_cams, other]}
        address: {type: string}
        timezone: {type: string}
        wifi_name: {type: string}
        wifi_signal_strength: {type: integer}
        volume: {type: integer}
        has_light: {type: boolean}
        light_brightness: {type: integer}
        motion_detection_enabled: {type: boolean}
        health: {$ref: '#/components/schemas/DeviceHealth'}
    Other:
      type: object
      required: [id, name, family, address, timezone, kind]
      properties:
        id: {type: string, x-go-name: ID}
        name: {type: string}
        family: {type: string, description: Known families include other; unknown families remain valid., x-extensible-enum: [doorbots, chimes, stickup_cams, other]}
        address: {type: string}
        timezone: {type: string}
        kind: {type: string, description: Known legacy kinds include intercom_handset_audio; unfamiliar hardware kinds remain valid., x-extensible-enum: [intercom_handset_audio, intercom_handset_video, stickup_cam_mini_ptz_v1]}
        health: {$ref: '#/components/schemas/DeviceHealth'}
    DevicesResponse:
      type: object
      required: [doorbots, chimes, stickup_cams, other]
      properties:
        doorbots: {type: array, x-go-name: Doorbells, items: {$ref: '#/components/schemas/Doorbell'}}
        chimes: {type: array, items: {$ref: '#/components/schemas/Chime'}}
        stickup_cams: {type: array, x-go-name: StickUpCams, items: {$ref: '#/components/schemas/StickUpCam'}}
        other: {type: array, items: {$ref: '#/components/schemas/Other'}}
    AuthResponse:
      type: object
      required: [access_token, refresh_token, expires_in, token_type]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        expires_in: {type: integer}
        token_type: {type: string, description: Bearer is used by the implemented OAuth flow; unknown token types remain representable., x-extensible-enum: [Bearer]}
    EventKind:
      type: string
      description: Known event kinds are motion, ding and on_demand. Preserve future values from the service.
      x-extensible-enum: [motion, ding, on_demand]
    Event:
      type: object
      required: [kind, device_id, timestamp, data]
      properties:
        kind: {$ref: '#/components/schemas/EventKind'}
        device_id: {type: integer, format: int64, x-go-name: DeviceID}
        timestamp: {type: string}
        data: {type: object, additionalProperties: true}
    Recording:
      type: object
      required: [id, kind, answered, created_at, device_id]
      properties:
        id: {type: integer, format: int64, x-go-name: ID}
        kind: {type: string, description: "Known recording kinds are motion, ding and on_demand; future values remain valid.", x-extensible-enum: [motion, ding, on_demand]}
        answered: {type: boolean}
        created_at: {type: string}
        device_id: {type: integer, format: int64, x-go-name: DeviceID}
    RecordingHistoryResponse:
      type: object
      required: [recordings]
      properties:
        recordings: {type: array, items: {$ref: '#/components/schemas/Recording'}}
