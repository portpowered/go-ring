openapi: 3.0.3
info:
  title: Ring dependency response models
  version: 0.1.0
  description: >-
    Wire fields consumed by the legacy device and history adapters. The v3
    device list is captured in openapi.yaml; these projections also retain
    fields present in the Python legacy fixtures for family conversion.
paths: {}
components:
  schemas:
    RingDevice:
      type: object
      required: [id]
      properties:
        id: {type: integer, format: int64, x-go-name: ID}
        name: {type: string, x-go-type-skip-optional-pointer: true}
        description: {type: string, x-go-type-skip-optional-pointer: true}
        kind: {type: string, x-go-type-skip-optional-pointer: true, description: Known hardware kinds include these captured and Python legacy examples; unknown kinds remain valid., x-extensible-enum: [stickup_cam_mini_ptz_v1, lpd_v1, chime, intercom_handset_audio]}
        family: {type: string, x-go-type-skip-optional-pointer: true, description: Known legacy device families; unknown families remain valid., x-extensible-enum: [doorbots, chimes, stickup_cams, other]}
        owned: {type: boolean}
        address: {type: string, x-go-type-skip-optional-pointer: true}
        timezone: {type: string, x-go-type-skip-optional-pointer: true}
        time_zone: {type: string, x-go-name: TimeZone, x-go-type-skip-optional-pointer: true}
        wifi_name: {type: string, x-go-name: WifiName, x-go-type-skip-optional-pointer: true}
        wifi_signal_strength: {type: integer, x-go-name: WifiSignalStrength, x-go-type-skip-optional-pointer: true}
        volume: {type: integer, minimum: 0, maximum: 11, x-go-type-skip-optional-pointer: true, description: Legacy device volume range accepted by the Go client.}
        has_light: {type: boolean, x-go-type-skip-optional-pointer: true}
        light_brightness: {type: integer}
        motion_detection_enabled: {type: boolean, x-go-type-skip-optional-pointer: true}
        health: {$ref: '#/components/schemas/RingDeviceHealth'}
    RingDeviceHealth:
      description: Known legacy health fields; unrecognized hardware fields stay extensible.
      type: object
      properties:
        battery_level: {type: integer}
        battery_status: {type: string}
        signal_strength: {type: integer}
        firmware_version: {type: string}
        last_update: {type: string}
      additionalProperties: true
    RingDevicesResponse:
      description: Devices grouped by the adapter after decoding the raw list.
      type: object
      required: [doorbots, authorized_doorbots, chimes, stickup_cams, other]
      properties:
        doorbots: {type: array, items: {$ref: '#/components/schemas/RingDevice'}}
        authorized_doorbots: {type: array, items: {$ref: '#/components/schemas/RingDevice'}}
        chimes: {type: array, items: {$ref: '#/components/schemas/RingDevice'}}
        stickup_cams: {type: array, x-go-name: StickupCams, items: {$ref: '#/components/schemas/RingDevice'}}
        other: {type: array, items: {$ref: '#/components/schemas/RingDevice'}}
    RingDoorbot:
      type: object
      required: [id]
      properties:
        id: {type: integer, format: int64, x-go-name: ID}
        description: {type: string, x-go-type-skip-optional-pointer: true}
        type: {type: string, x-go-type-skip-optional-pointer: true}
    RingRecording:
      type: object
      required: [id, doorbot, device_id]
      properties:
        id: {type: integer, format: int64, x-go-name: ID}
        kind: {type: string, x-go-type-skip-optional-pointer: true, description: "Known recording kinds are ding, motion and on_demand; unknown kinds remain valid.", x-extensible-enum: [ding, motion, on_demand]}
        answered: {type: boolean, x-go-type-skip-optional-pointer: true}
        created_at: {type: string, x-go-type-skip-optional-pointer: true}
        device_id: {type: integer, format: int64, x-go-name: DeviceID, x-go-json-ignore: true}
        doorbot: {$ref: '#/components/schemas/RingDoorbot'}
    RingRecordingHistoryResponse:
      description: Adapter result; the HTTP response itself is an array.
      type: object
      required: [recordings]
      properties:
        recordings: {type: array, items: {$ref: '#/components/schemas/RingRecording'}}
    RingRecordingURLResponse:
      type: object
      required: [url]
      properties:
        url: {type: string, x-go-name: URL}
