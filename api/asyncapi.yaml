asyncapi: 3.0.0
info:
  title: Ring signaling application messages
  version: 0.1.0
  description: >-
    Observed WebSocket application envelope and PTZ RPC shapes from the included
    sanitized signaling conversations. Binary/control frames and complete media
    negotiation semantics are outside this contract.
servers:
  ring:
    host: api.prod.signalling.ring.devices.a2z.com
    protocol: wss
    description: Captured signaling host; tests use a local peer.
channels:
  signaling:
    address: /ws
    messages:
      clientMessage: {$ref: '#/components/messages/ClientMessage'}
      serverMessage: {$ref: '#/components/messages/ServerMessage'}
operations:
  sendMessage:
    action: send
    channel: {$ref: '#/channels/signaling'}
    messages: [{$ref: '#/channels/signaling/messages/clientMessage'}]
  receiveMessage:
    action: receive
    channel: {$ref: '#/channels/signaling'}
    messages: [{$ref: '#/channels/signaling/messages/serverMessage'}]
components:
  messages:
    ClientMessage:
      payload: {$ref: '#/components/schemas/ClientEnvelope'}
    ServerMessage:
      payload: {$ref: '#/components/schemas/ServerEnvelope'}
  schemas:
    ClientEnvelope:
      type: object
      required: [method, dialog_id, body]
      properties:
        method:
          type: string
          enum: [activate_session, camera_options, close, ice, live_view, mic_enable, notification, ping, playback, push_heartbeat, push_subscribe, push_unsubscribe, rpc, sdp, stream_options]
        dialog_id: {type: string}
        riid: {type: string}
        body: {type: object}
      allOf:
        - if: {properties: {method: {const: rpc}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [command]
                    properties:
                      command:
                        allOf:
                          - {$ref: '#/components/schemas/PTZRPC'}
                          - properties:
                              method: {enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Tilt.Step, PTZ.Tilt.Continuous]}
        - if: {properties: {method: {const: live_view}}}
          then:
            properties:
              body:
                type: object
                required: [doorbot_id, sdp]
                properties:
                  doorbot_id: {type: integer}
                  sdp: {type: string, minLength: 1}
                  stream_options:
                    type: object
                    properties:
                      audio_enabled: {type: boolean}
                      video_enabled: {type: boolean}
        - if: {properties: {method: {const: playback}}}
          then:
            properties:
              body:
                type: object
                required: [doorbot_id, entry_point, sdp, type]
                properties:
                  doorbot_id: {type: integer}
                  entry_point: {type: string}
                  sdp: {type: string, minLength: 1}
                  type: {const: cloud}
        - if: {properties: {method: {const: push_subscribe}}}
          then:
            properties:
              body:
                type: object
                required: [requested_notifications]
                properties:
                  requested_notifications:
                    type: array
                    minItems: 1
                    items: {$ref: '#/components/schemas/PushFilter'}
        - if: {properties: {method: {enum: [push_heartbeat, push_unsubscribe]}}}
          then:
            properties:
              body:
                type: object
                required: [subscription_id]
                properties:
                  subscription_id: {type: string}
    ServerEnvelope:
      type: object
      required: [method, dialog_id, body]
      properties:
        method:
          type: string
          enum: [camera_started, close, ice, notification, pong, push_event, push_subscription_ack, rpc, sdp, session_created]
        dialog_id: {type: string}
        riid: {type: string}
        body: {type: object}
      allOf:
        - if: {properties: {method: {const: rpc}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [command]
                    properties:
                      command:
                        oneOf:
                          - {$ref: '#/components/schemas/RPCResult'}
                          - {$ref: '#/components/schemas/RPCError'}
                          - allOf:
                              - {$ref: '#/components/schemas/PTZRPC'}
                              - properties: {method: {const: PTZ.Pan.Halted}}
        - if: {properties: {method: {const: sdp}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [sdp]
                    properties:
                      sdp: {type: string, minLength: 1}
                      session_info:
                        type: object
                        properties:
                          ping_interval: {type: integer, minimum: 1}
        - if: {properties: {method: {const: push_subscription_ack}}}
          then:
            properties:
              body:
                type: object
                required: [status, subscription_id]
                properties:
                  status: {type: string}
                  subscription_id: {type: string}
        - if: {properties: {method: {const: push_event}}}
          then:
            properties:
              body:
                type: object
                required: [notification_scope, notification_type, payload, subscription_id]
                properties:
                  filter_identifiers: {type: array, items: {type: string}}
                  ingestion_time_ms: {type: integer}
                  notification_scope: {type: string}
                  notification_type: {type: string}
                  payload: {type: object}
                  subscription_id: {type: string}
    PushFilter:
      type: object
      required: [filter_identifier, filters, notification_scope, notification_type]
      properties:
        filter_identifier: {type: string}
        filters:
          type: object
          properties:
            doorbot_ids: {type: array, items: {type: integer}}
        notification_scope: {type: string}
        notification_type: {type: string}
    PTZRPC:
      type: object
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: string}
        method:
          type: string
          enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Tilt.Step, PTZ.Tilt.Continuous, PTZ.Pan.Halted]
        params:
          type: object
          required: [sessionId, timestamp, version, direction]
          properties:
            sessionId: {type: string}
            timestamp: {type: number}
            version: {type: number, const: 1}
            direction: {type: string, enum: [LEFT, RIGHT, UP, DOWN]}
            speed: {type: number}
            reason: {type: string}
      allOf:
        - if: {properties: {method: {enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Pan.Halted]}}}
          then: {properties: {params: {properties: {direction: {enum: [LEFT, RIGHT]}}}}}
        - if: {properties: {method: {enum: [PTZ.Tilt.Step, PTZ.Tilt.Continuous]}}}
          then: {properties: {params: {properties: {direction: {enum: [UP, DOWN]}}}}}
        - if: {properties: {method: {enum: [PTZ.Pan.Continuous, PTZ.Tilt.Continuous]}}}
          then: {properties: {params: {required: [speed]}}}
        - if: {properties: {method: {const: PTZ.Pan.Halted}}}
          then: {properties: {params: {required: [reason]}}}
    SessionBody:
      type: object
      required: [doorbot_id, session_id]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string, minLength: 1}
    RPCResult:
      type: object
      required: [jsonrpc, id, result]
      not: {anyOf: [{required: [method]}, {required: [error]}]}
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: string}
        result:
          type: object
          required: [sessionId, timestamp, version]
          properties:
            sessionId: {type: string}
            timestamp: {type: number}
            version: {type: number, const: 1}
    RPCError:
      description: Synthetic error-handling contract; no RPC error was observed in these recordings.
      type: object
      required: [jsonrpc, id, error]
      not: {anyOf: [{required: [method]}, {required: [result]}]}
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}
    Heartbeat:
      description: Captured application ping from client and pong from server; timing policy is not specified here.
      type: object
      properties:
        method: {type: string, enum: [ping, pong]}
        body: {type: object}
