asyncapi: 3.0.0
info:
  title: Ring WebSocket application messages
  version: 0.3.0
  description: >-
    WebSocket application envelope and PTZ RPC shapes from inherited sanitized
    signaling conversations without verifiable capture provenance. These are
    historical regression inputs, not current provider evidence. The account
    event WebSocket contract is implementation-derived and experimental. Binary
    control frames and complete media negotiation semantics are outside this contract.
servers:
  ring:
    host: api.prod.signalling.ring.devices.a2z.com:443
    protocol: wss
    description: Historical signaling host; tests use a local peer.
  accountEvents:
    host: api.ring.com
    protocol: wss
    description: Implementation-derived experimental account event host; no sanitized live capture.
channels:
  serverEnvelope:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: &signalingWebSocketBinding
      ws:
        method: GET
        query:
          type: object
          required: [api_version, auth_type, client_id, token]
          properties:
            api_version: {type: string, const: '4.0'}
            auth_type: {type: string, const: ring_solutions}
            client_id: {type: string, pattern: '^ring_site-.+$'}
            token: {type: string, minLength: 1}
          additionalProperties: false
        bindingVersion: '0.1.0'
    messages:
      inboundDiscriminator: {$ref: '#/components/messages/InboundDiscriminator'}
      pushEvent: {$ref: '#/components/messages/PushEvent'}
      pushSubscriptionAck: {$ref: '#/components/messages/PushSubscriptionAck'}
      playbackAnswer: {$ref: '#/components/messages/PlaybackAnswer'}
      liveAnswer: {$ref: '#/components/messages/LiveAnswer'}
      liveICE: {$ref: '#/components/messages/LiveICE'}
      serverICE: {$ref: '#/components/messages/ServerICE'}
      sessionNotification: {$ref: '#/components/messages/SessionNotification'}
      sessionPong: {$ref: '#/components/messages/SessionPong'}
      sessionCreated: {$ref: '#/components/messages/SessionCreated'}
      serverCameraStarted: {$ref: '#/components/messages/ServerCameraStarted'}
      serverClose: {$ref: '#/components/messages/ServerClose'}
      serverRPC: {$ref: '#/components/messages/ServerRPC'}
  pushSubscribe:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      pushSubscribe:
        $ref: '#/components/messages/PushSubscribe'
  pushEvent:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      pushEvent:
        $ref: '#/components/messages/PushEvent'
  pushSubscriptionAck:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      pushSubscriptionAck:
        $ref: '#/components/messages/PushSubscriptionAck'
  pushHeartbeat:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      pushHeartbeat:
        $ref: '#/components/messages/PushHeartbeat'
  pushUnsubscribe:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      pushUnsubscribe:
        $ref: '#/components/messages/PushUnsubscribe'
  playbackOffer:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      playbackOffer:
        $ref: '#/components/messages/PlaybackOffer'
  playbackAnswer:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      playbackAnswer:
        $ref: '#/components/messages/PlaybackAnswer'
  playbackClose:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      playbackClose:
        $ref: '#/components/messages/PlaybackClose'
  iCECandidate:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      iCECandidate:
        $ref: '#/components/messages/ICECandidate'
  sessionNotification:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      sessionNotification:
        $ref: '#/components/messages/SessionNotification'
  sessionPing:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      sessionPing:
        $ref: '#/components/messages/SessionPing'
  sessionActivate:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      sessionActivate:
        $ref: '#/components/messages/SessionActivate'
  sessionMicrophone:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      sessionMicrophone:
        $ref: '#/components/messages/SessionMicrophone'
  sessionStreamOptions:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      sessionStreamAudioOptions:
        $ref: '#/components/messages/SessionStreamAudioOptions'
      sessionStreamVideoOptions:
        $ref: '#/components/messages/SessionStreamVideoOptions'
      sessionStreamAudioVideoOptions:
        $ref: '#/components/messages/SessionStreamAudioVideoOptions'
  sessionClose:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      sessionClose:
        $ref: '#/components/messages/SessionClose'
  sessionPong:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      sessionPong:
        $ref: '#/components/messages/SessionPong'
  liveView:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      liveView:
        $ref: '#/components/messages/LiveView'
  sessionCreated:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      sessionCreated:
        $ref: '#/components/messages/SessionCreated'
  liveAnswer:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      liveAnswer:
        $ref: '#/components/messages/LiveAnswer'
  liveICE:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      liveICE:
        $ref: '#/components/messages/LiveICE'
  pTZCommand:
    address: /ws
    servers: [{$ref: '#/servers/ring'}]
    bindings: *signalingWebSocketBinding
    messages:
      pTZCommand:
        $ref: '#/components/messages/PTZCommand'
      pTZContinuousCommand:
        $ref: '#/components/messages/PTZContinuousCommand'
  accountEvent:
    address: /clients_api/ws
    servers: [{$ref: '#/servers/accountEvents'}]
    bindings:
      ws:
        method: GET
        headers:
          type: object
          required: [Authorization]
          properties:
            Authorization: {type: string, description: Bearer access token from the caller's account context.}
            Hardware_id: {type: string, description: Optional persistent hardware identifier.}
        bindingVersion: '0.1.0'
    messages:
      accountEvent:
        $ref: '#/components/messages/AccountEvent'
operations:
  receiveServerEnvelope:
    action: receive
    title: Receive a signaling envelope
    summary: Dispatch a signaling message by its method.
    description: The common inbound envelope is decoded before each method-specific frame is validated.
    tags: [{name: Session}]
    channel: {$ref: '#/channels/serverEnvelope'}
  sendPushSubscribe:
    action: send
    title: Subscribe to push notifications
    summary: Request notifications for selected devices and event types.
    description: Starts a push subscription by sending the requested notification filters. The server responds with a subscription acknowledgment and identifier.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushSubscribe'
  receivePushEvent:
    action: receive
    title: Receive a push notification
    summary: Delivers an event that matches an active push subscription.
    description: Push events include the subscription identifier, event classification, and event payload. The payload fields depend on the notification type.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushEvent'
  receivePushSubscriptionAck:
    action: receive
    title: Confirm a push subscription
    summary: Returns the result and identifier for a push subscription request.
    description: The acknowledgment reports the subscription status and provides the identifier used for subsequent heartbeat and unsubscribe messages.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushSubscriptionAck'
  sendPushHeartbeat:
    action: send
    title: Keep a push subscription active
    summary: Sends a heartbeat for an active push subscription.
    description: A push heartbeat carries the subscription identifier so the service can maintain the subscription. The contract does not specify its required interval.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushHeartbeat'
  sendPushUnsubscribe:
    action: send
    title: Unsubscribe from push notifications
    summary: Requests that an active push subscription be stopped.
    description: Sends the subscription identifier to end delivery for that subscription.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushUnsubscribe'
  sendPlaybackOffer:
    action: send
    title: Start cloud playback
    summary: Offers a playback stream for a device recording.
    description: Sends the device identifier, timeline entry point, and local session description to begin negotiating a cloud playback session.
    tags: [{name: Playback}]
    channel:
      $ref: '#/channels/playbackOffer'
  receivePlaybackAnswer:
    action: receive
    title: Receive the playback answer
    summary: Returns the remote session description for cloud playback.
    description: The answer includes the device and playback session identifiers and the session description used to complete playback negotiation. Optional session information can include a heartbeat interval and region.
    tags: [{name: Playback}]
    channel:
      $ref: '#/channels/playbackAnswer'
  sendPlaybackClose:
    action: send
    title: Close a playback session
    summary: Ends a cloud playback session.
    description: Sends the device and playback session identifiers with a close reason to terminate the playback exchange.
    tags: [{name: Playback}]
    channel:
      $ref: '#/channels/playbackClose'
  sendICECandidate:
    action: send
    title: Send an ICE candidate
    summary: Shares a connectivity candidate for a signaling session.
    description: Sends a candidate together with its media-line index and device and session identifiers to exchange connection information during negotiation.
    tags: [{name: Session negotiation}]
    channel:
      $ref: '#/channels/iCECandidate'
  receiveSessionNotification:
    action: receive
    title: Receive a session notification
    summary: Reports whether a device signaling session was accepted.
    description: The notification identifies the device and session, provides a success indicator, and may include a service message.
    tags: [{name: Session}]
    channel:
      $ref: '#/channels/sessionNotification'
  sendSessionPing:
    action: send
    title: Send a session heartbeat
    summary: Checks that a signaling session remains active.
    description: Sends a ping associated with the device and session. The service replies with a pong; this contract does not prescribe the ping interval.
    tags: [{name: Session}]
    channel:
      $ref: '#/channels/sessionPing'
  sendSessionActivate:
    action: send
    title: Activate a device session
    summary: Start the negotiated device session.
    description: Sends the negotiated device and session identifiers to activate a live stream.
    tags: [{name: Session}]
    channel: {$ref: '#/channels/sessionActivate'}
  sendSessionMicrophone:
    action: send
    title: Set microphone state
    summary: Enable or disable microphone audio in a device session.
    description: Sends the device and session identifiers with the requested microphone state.
    tags: [{name: Session}]
    channel: {$ref: '#/channels/sessionMicrophone'}
  sendSessionStreamOptions:
    action: send
    title: Set stream options
    summary: Update audio or video options for a device session.
    description: Sends the device and session identifiers with the supplied option values.
    tags: [{name: Session}]
    channel: {$ref: '#/channels/sessionStreamOptions'}
  sendSessionClose:
    action: send
    title: Close a device session
    summary: Request termination of a live device session.
    description: Sends the device and session identifiers to close the signaling session.
    tags: [{name: Session}]
    channel: {$ref: '#/channels/sessionClose'}
  receiveSessionPong:
    action: receive
    title: Receive a session heartbeat response
    summary: Confirms receipt of a signaling session ping.
    description: The pong identifies the device and session associated with the heartbeat exchange.
    tags: [{name: Session}]
    channel:
      $ref: '#/channels/sessionPong'
  sendLiveView:
    action: send
    title: Start a live view
    summary: Offers a live audio and video session for a device.
    description: Sends the device identifier, session description, and optional audio and video preferences to begin live-view negotiation.
    tags: [{name: Live view}]
    channel:
      $ref: '#/channels/liveView'
  receiveSessionCreated:
    action: receive
    title: Receive the live-view session identifier
    summary: Returns the signaling session identifier for a device.
    description: The response identifies the device and the session created for subsequent signaling messages.
    tags: [{name: Live view}]
    channel:
      $ref: '#/channels/sessionCreated'
  receiveLiveAnswer:
    action: receive
    title: Receive the live-view answer
    summary: Returns the remote session description for live view.
    description: The answer includes the device identifier, control-session identifier, and remote session description. It may include session information such as a heartbeat interval.
    tags: [{name: Live view}]
    channel:
      $ref: '#/channels/liveAnswer'
  sendLiveICE:
    action: send
    title: Send a live-view ICE candidate
    summary: Shares a connectivity candidate for a live-view session.
    description: Sends the candidate, media identifier, and media-line index with the device identifier to exchange connection information during live-view negotiation.
    tags: [{name: Live view}]
    channel:
      $ref: '#/channels/liveICE'
  sendPTZCommand:
    action: send
    title: Control camera pan and tilt
    summary: Sends a directional pan or tilt command during a device session.
    description: Sends a JSON-RPC command for a supported pan or tilt movement, including direction and, for continuous movement, normalized speed. The command is associated with the device and session.
    tags: [{name: Camera controls}]
    channel:
      $ref: '#/channels/pTZCommand'
  receiveAccountEvent:
    action: receive
    title: Receive an account event
    summary: Receive an experimental account event over the WebSocket.
    description: Implementation-derived frame projection; only kind, device ID, and timestamp are currently typed.
    tags: [{name: Account events}]
    channel:
      $ref: '#/channels/accountEvent'
