      properties:
        filter_identifiers: {type: array, items: {type: string}}
        ingestion_time_ms: {type: integer, format: int64, minimum: 0, description: Unix time in milliseconds.}
        notification_scope: {type: string, description: Observed scope is event; future scopes remain valid., x-extensible-enum: [event]}
        notification_type: {type: string, description: Observed type is shoulder_tap; future types remain valid., x-extensible-enum: [shoulder_tap]}
        payload: {$ref: '#/components/schemas/PushEventPayload'}
        subscription_id: {type: string}
    PushEventPayload:
      description: Historical shoulder-tap event payload; other notification types may extend it.
      type: object
      properties:
        device_id: {type: string}
        location_id: {type: string}
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
      additionalProperties: true
    PlaybackOfferFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: playback}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PlaybackOfferBody'}
    PlaybackOfferBody:
      type: object
      required: [doorbot_id, entry_point, sdp, type]
      properties:
        doorbot_id: {type: integer}
        entry_point: {type: string, description: Observed entry point is timeline; other playback entries may be supported., x-extensible-enum: [timeline]}
        sdp: {type: string, minLength: 1}
        type: {type: string, const: cloud}
    PlaybackAnswerFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: sdp}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PlaybackAnswerBody'}
    PlaybackAnswerBody:
      type: object
      required: [doorbot_id, session_id, type, sdp]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string}
        type: {type: string, const: answer}
        sdp: {type: string, minLength: 1}
        session_info: {$ref: '#/components/schemas/PlaybackSessionInfo'}
      additionalProperties: true
    PlaybackSessionInfo:
      type: object
      properties:
        ping_interval: {type: integer, minimum: 1, description: Server-provided application heartbeat interval in seconds.}
        region: {type: string}
      additionalProperties: true
    PlaybackCloseFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: close}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PlaybackCloseBody'}
    PlaybackCloseBody:
      type: object
      required: [doorbot_id, session_id, reason]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string}
        reason: {$ref: '#/components/schemas/PlaybackCloseReason'}
    PlaybackCloseReason:
      type: object
      required: [code, text]
      properties:
        code: {type: integer, description: Historical client close uses zero.}
        text: {type: string, const: client_closed, description: Historical client close uses client_closed.}
    ClientEnvelope:
      type: object
      required: [method, dialog_id, body]
      properties:
        method:
          type: string
          enum: [activate_session, camera_options, close, ice, live_view, mic_enable, notification, ping, playback, push_heartbeat, push_subscribe, push_unsubscribe, rpc, sdp, stream_options]
        dialog_id: {type: string}
        riid: {type: string}
        body: {type: object}
      allOf:
        - if: {properties: {method: {const: rpc}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [command]
                    properties:
                      command:
                        allOf:
                          - {$ref: '#/components/schemas/PTZRPC'}
                          - properties:
                              method: {enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Tilt.Step, PTZ.Tilt.Continuous]}
        - if: {properties: {method: {const: live_view}}}
          then:
            properties:
              body:
                type: object
                required: [doorbot_id, sdp]
                properties:
                  doorbot_id: {type: integer}
                  sdp: {type: string, minLength: 1}
                  stream_options:
                    type: object
                    properties:
                      audio_enabled: {type: boolean}
                      video_enabled: {type: boolean}
        - if: {properties: {method: {const: playback}}}
          then:
            properties:
              body:
                type: object
                required: [doorbot_id, entry_point, sdp, type]
                properties:
                  doorbot_id: {type: integer}
                  entry_point: {type: string, description: Observed entry point is timeline; other playback entries may be supported., x-extensible-enum: [timeline]}
                  sdp: {type: string, minLength: 1}
                  type: {const: cloud}
        - if: {properties: {method: {const: push_subscribe}}}
          then:
            properties:
              body:
                type: object
                required: [requested_notifications]
                properties:
                  requested_notifications:
                    type: array
                    minItems: 1
                    items: {$ref: '#/components/schemas/PushFilter'}
        - if: {properties: {method: {enum: [push_heartbeat, push_unsubscribe]}}}
          then:
            properties:
              body:
                type: object
                required: [subscription_id]
                properties:
                  subscription_id: {type: string}
    ServerEnvelope:
      type: object
      required: [method, dialog_id, body]
      properties:
        method:
          type: string
          enum: [camera_started, close, ice, notification, pong, push_event, push_subscription_ack, rpc, sdp, session_created]
        dialog_id: {type: string}
        riid: {type: string}
        body: {type: object}
      allOf:
        - if: {properties: {method: {const: rpc}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [command]
                    properties:
                      command:
                        oneOf:
                          - {$ref: '#/components/schemas/RPCResult'}
                          - {$ref: '#/components/schemas/RPCError'}
                          - allOf:
                              - {$ref: '#/components/schemas/PTZRPC'}
                              - properties: {method: {const: PTZ.Pan.Halted}}
        - if: {properties: {method: {const: sdp}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [sdp]
                    properties:
                      sdp: {type: string, minLength: 1}
                      session_info:
                        type: object
                        properties:
                          ping_interval: {type: integer, minimum: 1, description: Server-provided heartbeat interval in seconds.}
        - if: {properties: {method: {const: push_subscription_ack}}}
          then:
            properties:
              body:
                type: object
                required: [status, subscription_id]
                properties:
                  status: {type: string, description: Observed successful status is ok; unknown server statuses remain valid., x-extensible-enum: [ok]}
                  subscription_id: {type: string}
        - if: {properties: {method: {const: push_event}}}
          then:
            properties:
              body:
                type: object
                required: [notification_scope, notification_type, payload, subscription_id]
                properties:
                  filter_identifiers: {type: array, items: {type: string}}
                  ingestion_time_ms: {type: integer, format: int64, minimum: 0, description: Unix time in milliseconds.}
                  notification_scope: {type: string, description: Observed scope is event; future scopes remain valid., x-extensible-enum: [event]}
                  notification_type: {type: string, description: Observed type is shoulder_tap; future types remain valid., x-extensible-enum: [shoulder_tap]}
                  payload: {type: object}
                  subscription_id: {type: string}
    PushFilter:
      type: object
      required: [filter_identifier, filters, notification_scope, notification_type]
      properties:
        filter_identifier: {type: string}
        filters: {$ref: '#/components/schemas/PushFilters'}
        notification_scope: {type: string, description: Observed scope is event; future scopes remain valid., x-extensible-enum: [event]}
        notification_type: {type: string, description: Observed type is shoulder_tap; future types remain valid., x-extensible-enum: [shoulder_tap]}
    PushFilters:
      type: object
      properties:
        doorbot_ids: {type: array, items: {type: integer, format: int64}}
    PTZRPC:
      type: object
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: string}
        method:
          type: string
          enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Tilt.Step, PTZ.Tilt.Continuous, PTZ.Pan.Halted]
        params:
          type: object
          required: [sessionId, timestamp, version, direction]
          properties:
            sessionId: {type: string}
            timestamp: {type: integer, format: int64, minimum: 0, description: Client-generated Unix time in milliseconds.}
            version: {type: integer, const: 1}
            direction: {type: string, enum: [LEFT, RIGHT, UP, DOWN]}
            speed: {type: number, minimum: 0, maximum: 1, description: Normalized continuous PTZ speed; zero stops motion and one is full requested speed.}
            reason: {type: string, description: Observed halt reason is LIMIT_REACHED; other server reasons may appear., x-extensible-enum: [LIMIT_REACHED]}
      allOf:
        - if: {properties: {method: {enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Pan.Halted]}}}
          then: {properties: {params: {properties: {direction: {enum: [LEFT, RIGHT]}}}}}
        - if: {properties: {method: {enum: [PTZ.Tilt.Step, PTZ.Tilt.Continuous]}}}
          then: {properties: {params: {properties: {direction: {enum: [UP, DOWN]}}}}}
        - if: {properties: {method: {enum: [PTZ.Pan.Continuous, PTZ.Tilt.Continuous]}}}
          then: {properties: {params: {required: [speed]}}}
        - if: {properties: {method: {const: PTZ.Pan.Halted}}}
          then: {properties: {params: {required: [reason]}}}
