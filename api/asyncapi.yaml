asyncapi: 3.0.0
info:
  title: Ring signaling application messages
  version: 0.3.0
  description: >-
    WebSocket application envelope and PTZ RPC shapes from inherited sanitized
    signaling conversations without verifiable capture provenance. These are
    historical regression inputs, not current provider evidence. Binary/control
    frames and complete media negotiation semantics are outside this contract.
servers:
  ring:
    host: api.prod.signalling.ring.devices.a2z.com
    protocol: wss
    description: Historical signaling host; tests use a local peer.
channels:
  pushSubscribe:
    address: /ws
    messages:
      pushSubscribe:
        $ref: '#/components/messages/PushSubscribe'
  pushEvent:
    address: /ws
    messages:
      pushEvent:
        $ref: '#/components/messages/PushEvent'
  pushSubscriptionAck:
    address: /ws
    messages:
      pushSubscriptionAck:
        $ref: '#/components/messages/PushSubscriptionAck'
  pushHeartbeat:
    address: /ws
    messages:
      pushHeartbeat:
        $ref: '#/components/messages/PushHeartbeat'
  pushUnsubscribe:
    address: /ws
    messages:
      pushUnsubscribe:
        $ref: '#/components/messages/PushUnsubscribe'
  playbackOffer:
    address: /ws
    messages:
      playbackOffer:
        $ref: '#/components/messages/PlaybackOffer'
  playbackAnswer:
    address: /ws
    messages:
      playbackAnswer:
        $ref: '#/components/messages/PlaybackAnswer'
  playbackClose:
    address: /ws
    messages:
      playbackClose:
        $ref: '#/components/messages/PlaybackClose'
  iCECandidate:
    address: /ws
    messages:
      iCECandidate:
        $ref: '#/components/messages/ICECandidate'
  sessionNotification:
    address: /ws
    messages:
      sessionNotification:
        $ref: '#/components/messages/SessionNotification'
  sessionPing:
    address: /ws
    messages:
      sessionPing:
        $ref: '#/components/messages/SessionPing'
  sessionPong:
    address: /ws
    messages:
      sessionPong:
        $ref: '#/components/messages/SessionPong'
  liveView:
    address: /ws
    messages:
      liveView:
        $ref: '#/components/messages/LiveView'
  sessionCreated:
    address: /ws
    messages:
      sessionCreated:
        $ref: '#/components/messages/SessionCreated'
  liveAnswer:
    address: /ws
    messages:
      liveAnswer:
        $ref: '#/components/messages/LiveAnswer'
  liveICE:
    address: /ws
    messages:
      liveICE:
        $ref: '#/components/messages/LiveICE'
  pTZCommand:
    address: /ws
    messages:
      pTZCommand:
        $ref: '#/components/messages/PTZCommand'
operations:
  sendPushSubscribe:
    action: send
    title: Subscribe to push notifications
    summary: Request notifications for selected devices and event types.
    description: Starts a push subscription by sending the requested notification filters. The server responds with a subscription acknowledgment and identifier.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushSubscribe'
  receivePushEvent:
    action: receive
    title: Receive a push notification
    summary: Delivers an event that matches an active push subscription.
    description: Push events include the subscription identifier, event classification, and event payload. The payload fields depend on the notification type.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushEvent'
  receivePushSubscriptionAck:
    action: receive
    title: Confirm a push subscription
    summary: Returns the result and identifier for a push subscription request.
    description: The acknowledgment reports the subscription status and provides the identifier used for subsequent heartbeat and unsubscribe messages.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushSubscriptionAck'
  sendPushHeartbeat:
    action: send
    title: Keep a push subscription active
    summary: Sends a heartbeat for an active push subscription.
    description: A push heartbeat carries the subscription identifier so the service can maintain the subscription. The contract does not specify its required interval.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushHeartbeat'
  sendPushUnsubscribe:
    action: send
    title: Unsubscribe from push notifications
    summary: Requests that an active push subscription be stopped.
    description: Sends the subscription identifier to end delivery for that subscription.
    tags: [{name: Push notifications}]
    channel:
      $ref: '#/channels/pushUnsubscribe'
  sendPlaybackOffer:
    action: send
    title: Start cloud playback
    summary: Offers a playback stream for a device recording.
    description: Sends the device identifier, timeline entry point, and local session description to begin negotiating a cloud playback session.
    tags: [{name: Playback}]
    channel:
      $ref: '#/channels/playbackOffer'
  receivePlaybackAnswer:
    action: receive
    title: Receive the playback answer
    summary: Returns the remote session description for cloud playback.
    description: The answer includes the device and playback session identifiers and the session description used to complete playback negotiation. Optional session information can include a heartbeat interval and region.
    tags: [{name: Playback}]
    channel:
      $ref: '#/channels/playbackAnswer'
  sendPlaybackClose:
    action: send
    title: Close a playback session
    summary: Ends a cloud playback session.
    description: Sends the device and playback session identifiers with a close reason to terminate the playback exchange.
    tags: [{name: Playback}]
    channel:
      $ref: '#/channels/playbackClose'
  sendICECandidate:
    action: send
    title: Send an ICE candidate
    summary: Shares a connectivity candidate for a signaling session.
    description: Sends a candidate together with its media-line index and device and session identifiers to exchange connection information during negotiation.
    tags: [{name: Session negotiation}]
    channel:
      $ref: '#/channels/iCECandidate'
  receiveSessionNotification:
    action: receive
    title: Receive a session notification
    summary: Reports whether a device signaling session was accepted.
    description: The notification identifies the device and session, provides a success indicator, and may include a service message.
    tags: [{name: Session}]
    channel:
      $ref: '#/channels/sessionNotification'
  sendSessionPing:
    action: send
    title: Send a session heartbeat
    summary: Checks that a signaling session remains active.
    description: Sends a ping associated with the device and session. The service replies with a pong; this contract does not prescribe the ping interval.
    tags: [{name: Session}]
    channel:
      $ref: '#/channels/sessionPing'
  receiveSessionPong:
    action: receive
    title: Receive a session heartbeat response
    summary: Confirms receipt of a signaling session ping.
    description: The pong identifies the device and session associated with the heartbeat exchange.
    tags: [{name: Session}]
    channel:
      $ref: '#/channels/sessionPong'
  sendLiveView:
    action: send
    title: Start a live view
    summary: Offers a live audio and video session for a device.
    description: Sends the device identifier, session description, and optional audio and video preferences to begin live-view negotiation.
    tags: [{name: Live view}]
    channel:
      $ref: '#/channels/liveView'
  receiveSessionCreated:
    action: receive
    title: Receive the live-view session identifier
    summary: Returns the signaling session identifier for a device.
    description: The response identifies the device and the session created for subsequent signaling messages.
    tags: [{name: Live view}]
    channel:
      $ref: '#/channels/sessionCreated'
  receiveLiveAnswer:
    action: receive
    title: Receive the live-view answer
    summary: Returns the remote session description for live view.
    description: The answer includes the device identifier, control-session identifier, and remote session description. It may include session information such as a heartbeat interval.
    tags: [{name: Live view}]
    channel:
      $ref: '#/channels/liveAnswer'
  sendLiveICE:
    action: send
    title: Send a live-view ICE candidate
    summary: Shares a connectivity candidate for a live-view session.
    description: Sends the candidate, media identifier, and media-line index with the device identifier to exchange connection information during live-view negotiation.
    tags: [{name: Live view}]
    channel:
      $ref: '#/channels/liveICE'
  sendPTZCommand:
    action: send
    title: Control camera pan and tilt
    summary: Sends a directional pan or tilt command during a device session.
    description: Sends a JSON-RPC command for a supported pan or tilt movement, including direction and, for continuous movement, normalized speed. The command is associated with the device and session.
    tags: [{name: Camera controls}]
    channel:
      $ref: '#/channels/pTZCommand'
components:
  messages:
    ClientMessage:
      payload: {$ref: '#/components/schemas/ClientEnvelope'}
    ServerMessage:
      payload: {$ref: '#/components/schemas/ServerEnvelope'}
    PushSubscribe:
      payload: {$ref: '#/components/schemas/PushSubscribeFrame'}
    PushEvent:
      payload: {$ref: '#/components/schemas/PushEventFrame'}
    PushSubscriptionAck:
      payload: {$ref: '#/components/schemas/PushSubscriptionAckFrame'}
    PushHeartbeat:
      payload: {$ref: '#/components/schemas/PushHeartbeatFrame'}
    PushUnsubscribe:
      payload: {$ref: '#/components/schemas/PushUnsubscribeFrame'}
    PlaybackOffer:
      payload: {$ref: '#/components/schemas/PlaybackOfferFrame'}
    PlaybackAnswer:
      payload: {$ref: '#/components/schemas/PlaybackAnswerFrame'}
    PlaybackClose:
      payload: {$ref: '#/components/schemas/PlaybackCloseFrame'}
    ICECandidate:
      payload: {$ref: '#/components/schemas/ICECandidateFrame'}
    SessionNotification:
      payload: {$ref: '#/components/schemas/SessionNotificationFrame'}
    SessionPing:
      payload: {$ref: '#/components/schemas/SessionPingFrame'}
    SessionPong:
      payload: {$ref: '#/components/schemas/SessionPongFrame'}
    LiveView:
      payload: {$ref: '#/components/schemas/LiveViewFrame'}
    SessionCreated:
      payload: {$ref: '#/components/schemas/SessionCreatedFrame'}
    LiveAnswer:
      payload: {$ref: '#/components/schemas/LiveAnswerFrame'}
    LiveICE:
      payload: {$ref: '#/components/schemas/LiveICEFrame'}
    PTZCommand:
      payload: {$ref: '#/components/schemas/PTZCommandFrame'}
  schemas:
    LiveViewFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: live_view}
        dialog_id: {type: string}
        body: {$ref: '#/components/schemas/LiveViewBody'}
    LiveViewBody:
      type: object
      required: [doorbot_id, sdp, stream_options, type]
      properties:
        doorbot_id: {type: integer}
        sdp: {type: string, minLength: 1}
        stream_options: {$ref: '#/components/schemas/LiveStreamOptions'}
        type: {type: string, const: offer}
    LiveStreamOptions:
      type: object
      properties:
        audio_enabled: {type: boolean}
        video_enabled: {type: boolean}
    SessionCreatedFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: session_created}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/SessionCreatedBody'}
    SessionCreatedBody:
      type: object
      required: [doorbot_id, session_id]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string, minLength: 1}
    LiveAnswerFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: sdp}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/LiveAnswerBody'}
    LiveAnswerBody:
      description: Live-view SDP answer; control session identity differs from the signaling session ID.
      type: object
      required: [doorbot_id, session_id, sdp, session_info, type]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string, minLength: 1}
        sdp: {type: string, minLength: 1}
        session_info: {$ref: '#/components/schemas/LiveAnswerInfo'}
        type: {type: string, const: answer}
      additionalProperties: true
    LiveAnswerInfo:
      type: object
      required: [session_id]
      properties:
        session_id: {type: string, minLength: 1}
        ping_interval: {type: integer, minimum: 1, description: Optional negotiated heartbeat interval in seconds.}
      additionalProperties: true
    LiveICEFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: ice}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/LiveICEBody'}
    LiveICEBody:
      type: object
      required: [doorbot_id, ice, mid, mlineindex]
      properties:
        doorbot_id: {type: integer}
        ice: {type: string}
        mid: {type: string}
        mlineindex: {type: integer, minimum: 0}
    PTZCommandFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: rpc}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PTZCommandBody'}
    PTZCommandBody:
      type: object
      required: [doorbot_id, session_id, command]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string}
        command: {$ref: '#/components/schemas/PTZWireCommand'}
    PTZWireCommand:
      description: Named wire fields for Go generation; PTZRPC adds method-specific validation constraints.
      type: object
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id: {type: string}
        method: {$ref: '#/components/schemas/PTZCommandMethod'}
        params: {$ref: '#/components/schemas/PTZWireParams'}
    PTZCommandMethod:
      type: string
      enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Tilt.Step, PTZ.Tilt.Continuous]
    PTZDirection:
      type: string
      enum: [LEFT, RIGHT, UP, DOWN]
    PTZWireParams:
      type: object
      required: [sessionId, timestamp, version, direction]
      properties:
        sessionId: {type: string}
        timestamp: {type: integer, format: int64, minimum: 0, description: Client-generated Unix time in milliseconds.}
        version: {type: integer, const: 1}
        direction: {$ref: '#/components/schemas/PTZDirection'}
        speed: {type: number, minimum: 0, maximum: 1, description: Normalized continuous PTZ speed; zero stops motion and one is full requested speed.}
        reason: {type: string, description: Observed halt reason is LIMIT_REACHED; other server reasons may appear., x-extensible-enum: [LIMIT_REACHED]}
    PushSubscriptionAckFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: push_subscription_ack}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PushSubscriptionAckBody'}
    PushSubscriptionAckBody:
      type: object
      required: [status, subscription_id]
      properties:
        status: {type: string, description: Observed successful status is ok; unknown server statuses remain valid., x-extensible-enum: [ok]}
        subscription_id: {type: string}
    PushHeartbeatFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: push_heartbeat}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PushSubscriptionBody'}
    PushUnsubscribeFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: push_unsubscribe}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PushSubscriptionBody'}
    PushSubscriptionBody:
      type: object
      required: [subscription_id]
      properties:
        subscription_id: {type: string}
    ICECandidateFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: ice}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/ICECandidateBody'}
    ICECandidateBody:
      type: object
      required: [doorbot_id, session_id, ice, mlineindex]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string}
        ice: {type: string}
        mlineindex: {type: integer, minimum: 0}
      additionalProperties: true
    SessionNotificationFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: notification}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/SessionNotificationBody'}
    SessionNotificationBody:
      type: object
      required: [doorbot_id, session_id, is_ok, text]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string}
        is_ok: {type: boolean}
        text: {type: string}
      additionalProperties: true
    SessionPingFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: ping}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/SessionBody'}
    SessionPongFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: pong}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/SessionBody'}
    PushSubscribeFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: push_subscribe}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PushSubscribeBody'}
    PushSubscribeBody:
      type: object
      required: [requested_notifications]
      properties:
        requested_notifications: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PushFilter'}}
    PushEventFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: push_event}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PushEventBody'}
    PushEventBody:
      type: object
      required: [notification_scope, notification_type, payload, subscription_id]
      properties:
        filter_identifiers: {type: array, items: {type: string}}
        ingestion_time_ms: {type: integer, format: int64, minimum: 0, description: Unix time in milliseconds.}
        notification_scope: {type: string, description: Observed scope is event; future scopes remain valid., x-extensible-enum: [event]}
        notification_type: {type: string, description: Observed type is shoulder_tap; future types remain valid., x-extensible-enum: [shoulder_tap]}
        payload: {$ref: '#/components/schemas/PushEventPayload'}
        subscription_id: {type: string}
    PushEventPayload:
      description: Historical shoulder-tap event payload; other notification types may extend it.
      type: object
      properties:
        device_id: {type: string}
        location_id: {type: string}
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
      additionalProperties: true
    PlaybackOfferFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: playback}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PlaybackOfferBody'}
    PlaybackOfferBody:
      type: object
      required: [doorbot_id, entry_point, sdp, type]
      properties:
        doorbot_id: {type: integer}
        entry_point: {type: string, description: Observed entry point is timeline; other playback entries may be supported., x-extensible-enum: [timeline]}
        sdp: {type: string, minLength: 1}
        type: {type: string, const: cloud}
    PlaybackAnswerFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: sdp}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PlaybackAnswerBody'}
    PlaybackAnswerBody:
      type: object
      required: [doorbot_id, session_id, type, sdp]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string}
        type: {type: string, const: answer}
        sdp: {type: string, minLength: 1}
        session_info: {$ref: '#/components/schemas/PlaybackSessionInfo'}
      additionalProperties: true
    PlaybackSessionInfo:
      type: object
      properties:
        ping_interval: {type: integer, minimum: 1, description: Server-provided application heartbeat interval in seconds.}
        region: {type: string}
      additionalProperties: true
    PlaybackCloseFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: close}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PlaybackCloseBody'}
    PlaybackCloseBody:
      type: object
      required: [doorbot_id, session_id, reason]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string}
        reason: {$ref: '#/components/schemas/PlaybackCloseReason'}
    PlaybackCloseReason:
      type: object
      required: [code, text]
      properties:
        code: {type: integer, description: Historical client close uses zero.}
        text: {type: string, description: Historical client close uses client_closed.}
    ClientEnvelope:
      type: object
      required: [method, dialog_id, body]
      properties:
        method:
          type: string
          enum: [activate_session, camera_options, close, ice, live_view, mic_enable, notification, ping, playback, push_heartbeat, push_subscribe, push_unsubscribe, rpc, sdp, stream_options]
        dialog_id: {type: string}
        riid: {type: string}
        body: {type: object}
      allOf:
        - if: {properties: {method: {const: rpc}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [command]
                    properties:
                      command:
                        allOf:
                          - {$ref: '#/components/schemas/PTZRPC'}
                          - properties:
                              method: {enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Tilt.Step, PTZ.Tilt.Continuous]}
        - if: {properties: {method: {const: live_view}}}
          then:
            properties:
              body:
                type: object
                required: [doorbot_id, sdp]
                properties:
                  doorbot_id: {type: integer}
                  sdp: {type: string, minLength: 1}
                  stream_options:
                    type: object
                    properties:
                      audio_enabled: {type: boolean}
                      video_enabled: {type: boolean}
        - if: {properties: {method: {const: playback}}}
          then:
            properties:
              body:
                type: object
                required: [doorbot_id, entry_point, sdp, type]
                properties:
                  doorbot_id: {type: integer}
                  entry_point: {type: string, description: Observed entry point is timeline; other playback entries may be supported., x-extensible-enum: [timeline]}
                  sdp: {type: string, minLength: 1}
                  type: {const: cloud}
        - if: {properties: {method: {const: push_subscribe}}}
          then:
            properties:
              body:
                type: object
                required: [requested_notifications]
                properties:
                  requested_notifications:
                    type: array
                    minItems: 1
                    items: {$ref: '#/components/schemas/PushFilter'}
        - if: {properties: {method: {enum: [push_heartbeat, push_unsubscribe]}}}
          then:
            properties:
              body:
                type: object
                required: [subscription_id]
                properties:
                  subscription_id: {type: string}
    ServerEnvelope:
      type: object
      required: [method, dialog_id, body]
      properties:
        method:
          type: string
          enum: [camera_started, close, ice, notification, pong, push_event, push_subscription_ack, rpc, sdp, session_created]
        dialog_id: {type: string}
        riid: {type: string}
        body: {type: object}
      allOf:
        - if: {properties: {method: {const: rpc}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [command]
                    properties:
                      command:
                        oneOf:
                          - {$ref: '#/components/schemas/RPCResult'}
                          - {$ref: '#/components/schemas/RPCError'}
                          - allOf:
                              - {$ref: '#/components/schemas/PTZRPC'}
                              - properties: {method: {const: PTZ.Pan.Halted}}
        - if: {properties: {method: {const: sdp}}}
          then:
            properties:
              body:
                allOf:
                  - {$ref: '#/components/schemas/SessionBody'}
                  - type: object
                    required: [sdp]
                    properties:
                      sdp: {type: string, minLength: 1}
                      session_info:
                        type: object
                        properties:
                          ping_interval: {type: integer, minimum: 1, description: Server-provided heartbeat interval in seconds.}
        - if: {properties: {method: {const: push_subscription_ack}}}
          then:
            properties:
              body:
                type: object
                required: [status, subscription_id]
                properties:
                  status: {type: string, description: Observed successful status is ok; unknown server statuses remain valid., x-extensible-enum: [ok]}
                  subscription_id: {type: string}
        - if: {properties: {method: {const: push_event}}}
          then:
            properties:
              body:
                type: object
                required: [notification_scope, notification_type, payload, subscription_id]
                properties:
                  filter_identifiers: {type: array, items: {type: string}}
                  ingestion_time_ms: {type: integer, format: int64, minimum: 0, description: Unix time in milliseconds.}
                  notification_scope: {type: string, description: Observed scope is event; future scopes remain valid., x-extensible-enum: [event]}
                  notification_type: {type: string, description: Observed type is shoulder_tap; future types remain valid., x-extensible-enum: [shoulder_tap]}
                  payload: {type: object}
                  subscription_id: {type: string}
    PushFilter:
      type: object
      required: [filter_identifier, filters, notification_scope, notification_type]
      properties:
        filter_identifier: {type: string}
        filters: {$ref: '#/components/schemas/PushFilters'}
        notification_scope: {type: string, description: Observed scope is event; future scopes remain valid., x-extensible-enum: [event]}
        notification_type: {type: string, description: Observed type is shoulder_tap; future types remain valid., x-extensible-enum: [shoulder_tap]}
    PushFilters:
      type: object
      properties:
        doorbot_ids: {type: array, items: {type: integer}}
    PTZRPC:
      type: object
      required: [jsonrpc, id, method, params]
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: string}
        method:
          type: string
          enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Tilt.Step, PTZ.Tilt.Continuous, PTZ.Pan.Halted]
        params:
          type: object
          required: [sessionId, timestamp, version, direction]
          properties:
            sessionId: {type: string}
            timestamp: {type: integer, format: int64, minimum: 0, description: Client-generated Unix time in milliseconds.}
            version: {type: integer, const: 1}
            direction: {type: string, enum: [LEFT, RIGHT, UP, DOWN]}
            speed: {type: number, minimum: 0, maximum: 1, description: Normalized continuous PTZ speed; zero stops motion and one is full requested speed.}
            reason: {type: string, description: Observed halt reason is LIMIT_REACHED; other server reasons may appear., x-extensible-enum: [LIMIT_REACHED]}
      allOf:
        - if: {properties: {method: {enum: [PTZ.Pan.Step, PTZ.Pan.Continuous, PTZ.Pan.Halted]}}}
          then: {properties: {params: {properties: {direction: {enum: [LEFT, RIGHT]}}}}}
        - if: {properties: {method: {enum: [PTZ.Tilt.Step, PTZ.Tilt.Continuous]}}}
          then: {properties: {params: {properties: {direction: {enum: [UP, DOWN]}}}}}
        - if: {properties: {method: {enum: [PTZ.Pan.Continuous, PTZ.Tilt.Continuous]}}}
          then: {properties: {params: {required: [speed]}}}
        - if: {properties: {method: {const: PTZ.Pan.Halted}}}
          then: {properties: {params: {required: [reason]}}}
    SessionBody:
      type: object
      required: [doorbot_id, session_id]
      properties:
        doorbot_id: {type: integer}
        session_id: {type: string, minLength: 1}
    RPCResult:
      type: object
      required: [jsonrpc, id, result]
      not: {anyOf: [{required: [method]}, {required: [error]}]}
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: string}
        result:
          type: object
          required: [sessionId, timestamp, version]
          properties:
            sessionId: {type: string}
            timestamp: {type: number}
            version: {type: number, const: 1}
    RPCError:
      description: Synthetic error-handling contract; no RPC error was observed in these recordings.
      type: object
      required: [jsonrpc, id, error]
      not: {anyOf: [{required: [method]}, {required: [result]}]}
      properties:
        jsonrpc: {const: '2.0'}
        id: {type: string}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: integer}
            message: {type: string}
    Heartbeat:
      description: Historical application ping from client and pong from server; timing policy is not specified here.
      type: object
      properties:
        method: {type: string, enum: [ping, pong]}
        body: {type: object}
