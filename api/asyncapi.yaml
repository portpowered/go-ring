      properties:
        requested_notifications: {type: array, minItems: 1, items: {$ref: '#/components/schemas/PushFilter'}}
    PushEventFrame:
      type: object
      required: [method, dialog_id, body]
      properties:
        method: {type: string, const: push_event}
        dialog_id: {type: string}
        riid: {type: string}
        body: {$ref: '#/components/schemas/PushEventBody'}
    PushEventBody:
      type: object
